# Clinical Trial SDTM Schema - Chat System Configuration
# All tables are joined to each other based on comprehendid using INNER JOIN
# Generated from PLO (Presentation Layer Objects) table logic documentation

schema:
  name: "Clinical Trial SDTM Schema"
  description: "Comprehensive schema for clinical trial data analysis including subject disposition, adverse events, lab information, ECG, vital signs, and more"
  join_key: "comprehendid"
  join_type: "INNER JOIN"

tables:

  # ==========================================================================
  # RPT_SUBJECT_DISPOSITION
  # ==========================================================================
  - table: "RPT_SUBJECT_DISPOSITION"
    description: "Consolidates information about how subjects progress through a study, including enrollment, completion, withdrawal, or death. Combines data from disposition, study, site, disposition configuration, death, and demographics tables."
    columns:
      - column: "comprehendid"
        type: "TEXT"
        description: "Unique identifier for the record within the Comprehend system"
      - column: "studyid"
        type: "TEXT"
        description: "Identifies the study the subject belongs to"
      - column: "siteid"
        type: "TEXT"
        description: "Identifies the site where the subject was enrolled"
      - column: "usubjid"
        type: "TEXT"
        description: "Unique subject identifier within a study"
      - column: "dscat"
        type: "TEXT"
        description: "Category of the disposition event"
      - column: "dsterm"
        type: "TEXT"
        description: "Verbatim term for the disposition event (e.g., Completed, Withdrew Consent)"
      - column: "dsstdtc"
        type: "DATE"
        description: "Start date of the disposition event"
      - column: "dsscat"
        type: "TEXT"
        description: "Subcategory of the disposition event"
      - column: "dsgrpid"
        type: "TEXT"
        description: "Group identifier for disposition"
      - column: "dsrefid"
        type: "TEXT"
        description: "Reference identifier for disposition"
      - column: "dsspid"
        type: "TEXT"
        description: "Sponsor-defined identifier for disposition"
      - column: "dsdecod"
        type: "TEXT"
        description: "Decoded term for the disposition event"
      - column: "visit"
        type: "TEXT"
        description: "Visit name associated with the disposition event"
      - column: "visitnum"
        type: "NUMERIC"
        description: "Visit number associated with the disposition event"
      - column: "visitdy"
        type: "INTEGER"
        description: "Study day of the visit"
      - column: "epoch"
        type: "TEXT"
        description: "Epoch of the study during which the event occurred"
      - column: "dsdtc"
        type: "TIMESTAMP"
        description: "Date and time of the disposition event"
      - column: "dsstdy"
        type: "INTEGER"
        description: "Study day of the start of the disposition event"
      - column: "objectuniquekey"
        type: "TEXT"
        description: "Unique key for the object"
      - column: "studyname"
        type: "TEXT"
        description: "Name of the study"
      - column: "program"
        type: "TEXT"
        description: "Clinical program the study belongs to"
      - column: "medicalindication"
        type: "TEXT"
        description: "Medical indication for the study"
      - column: "studyphase"
        type: "TEXT"
        description: "Phase of the clinical study"
      - column: "therapeuticarea"
        type: "TEXT"
        description: "Therapeutic area of the study"
      - column: "studydescription"
        type: "TEXT"
        description: "Description of the study"
      - column: "studysponsor"
        type: "TEXT"
        description: "Sponsor of the study"
      - column: "sitename"
        type: "TEXT"
        description: "Name of the site"
      - column: "sitecro"
        type: "TEXT"
        description: "Contract Research Organization for the site"
      - column: "sitecountry"
        type: "TEXT"
        description: "Country of the site"
      - column: "siteregion"
        type: "TEXT"
        description: "Region of the site"
      - column: "dsseq"
        type: "SMALLINT"
        description: "Sequence number configured for the disposition event"
      - column: "dslabel"
        type: "TEXT"
        description: "User-interface label for the disposition event"
      - column: "dsevent"
        type: "TEXT"
        description: "Internal event ID for the disposition"
      - column: "dsactive"
        type: "BOOLEAN"
        description: "Indicates if the disposition event signifies an active state"
      - column: "dswithdrawn"
        type: "BOOLEAN"
        description: "Indicates if the disposition event signifies withdrawal"
      - column: "dscompleted"
        type: "BOOLEAN"
        description: "Indicates if the disposition event signifies completion"
      - column: "dsstarting"
        type: "BOOLEAN"
        description: "Indicates if this is a starting event for a study"
      - column: "dsid"
        type: "UUID"
        description: "Unique identifier for the disposition configuration record"
      - column: "study_start_disposition"
        type: "TEXT"
        description: "Disposition term identified as the starting disposition for a study"
      - column: "deathcause"
        type: "TEXT"
        description: "Reported cause of death"
      - column: "deathdate"
        type: "DATE"
        description: "Date of death"
      - column: "arm"
        type: "TEXT"
        description: "Treatment arm the subject belongs to"
      - column: "dsdy"
        type: "INTEGER"
        description: "Relative study day for the disposition event"
      - column: "protver"
        type: "TEXT"
        description: "Protocol version relevant to the subject"

  # ==========================================================================
  # RPT_AE - Adverse Events
  # ==========================================================================
  - table: "RPT_AE"
    description: "Comprehensive view of adverse events (AEs) for clinical studies. Combines raw AE data with demographic information, study details, site specifics, and derived time-based metrics. Includes MedDRA coding hierarchy."
    columns:
      - column: "comprehendid"
        type: "TEXT"
        description: "Unique identifier for the subject record across the Comprehend platform"
      - column: "studyid"
        type: "TEXT"
        description: "Identifier for the study"
      - column: "siteid"
        type: "TEXT"
        description: "Identifier for the site within a study"
      - column: "usubjid"
        type: "TEXT"
        description: "Unique subject identifier within a study"
      - column: "aeterm"
        type: "TEXT"
        description: "Reported term for the adverse event"
      - column: "aebodsys"
        type: "TEXT"
        description: "Body system affected by the adverse event"
      - column: "aestdtc"
        type: "DATE"
        description: "Start date of the adverse event"
      - column: "aesttm"
        type: "TIME"
        description: "Start time of the adverse event"
      - column: "aeendtc"
        type: "DATE"
        description: "End date of the adverse event"
      - column: "aeentm"
        type: "TIME"
        description: "End time of the adverse event"
      - column: "aesev"
        type: "TEXT"
        description: "Severity of the AE. Defaults to Not Available if NULL"
      - column: "aeser"
        type: "TEXT"
        description: "Seriousness of the AE. Standardized to Serious or Non-Serious"
      - column: "aerelnst"
        type: "TEXT"
        description: "Relationship of the AE to the study intervention"
      - column: "aeseq"
        type: "NUMERIC"
        description: "Sequence number of the AE for a subject"
      - column: "aeverbatim"
        type: "TEXT"
        description: "Verbatim reported term for the AE"
      - column: "aellt"
        type: "TEXT"
        description: "Lower-Level Term (MedDRA)"
      - column: "aelltcd"
        type: "TEXT"
        description: "Lower-Level Term Code (MedDRA)"
      - column: "aeptcd"
        type: "TEXT"
        description: "Preferred Term Code (MedDRA)"
      - column: "aehlt"
        type: "TEXT"
        description: "High-Level Term (MedDRA)"
      - column: "aehltcd"
        type: "TEXT"
        description: "High-Level Term Code (MedDRA)"
      - column: "aehlgt"
        type: "TEXT"
        description: "High-Level Group Term (MedDRA)"
      - column: "aehlgtcd"
        type: "TEXT"
        description: "High-Level Group Term Code (MedDRA)"
      - column: "aebdsycd"
        type: "TEXT"
        description: "Body System or Organ Class Code (MedDRA)"
      - column: "aesoc"
        type: "TEXT"
        description: "System Organ Class (MedDRA)"
      - column: "aesoccd"
        type: "TEXT"
        description: "System Organ Class Code (MedDRA)"
      - column: "preferredterm"
        type: "TEXT"
        description: "MedDRA Preferred Term"
      - column: "aeacn"
        type: "TEXT"
        description: "Action Taken with Study Treatment"
      - column: "aeout"
        type: "TEXT"
        description: "Outcome of the AE"
      - column: "aetox"
        type: "TEXT"
        description: "Toxicity"
      - column: "aetoxgr"
        type: "TEXT"
        description: "Toxicity grade. Defaults to Not Available if NULL"
      - column: "aeongo"
        type: "TEXT"
        description: "Is AE ongoing?"
      - column: "aecomm"
        type: "TEXT"
        description: "Comments about the AE"
      - column: "aespid"
        type: "TEXT"
        description: "Sponsor-defined identifier"
      - column: "aestdtc_iso"
        type: "TEXT"
        description: "ISO 8601 formatted AE start date"
      - column: "aeendtc_iso"
        type: "TEXT"
        description: "ISO 8601 formatted AE end date"
      - column: "aerptdt"
        type: "DATE"
        description: "AE reported date"
      - column: "aesi"
        type: "TEXT"
        description: "AE serious event indicator"
      - column: "aeepreli"
        type: "TEXT"
        description: "AE expectedness or preliminary report"
      - column: "aetrtem"
        type: "TEXT"
        description: "Treatment emergent AE flag"
      - column: "aedis"
        type: "TEXT"
        description: "AE Discontinuation Flag"
      - column: "studyname"
        type: "TEXT"
        description: "Name of the study"
      - column: "sitename"
        type: "TEXT"
        description: "Name of the site"
      - column: "sitecountry"
        type: "TEXT"
        description: "Country of the site"
      - column: "sitecountrycode"
        type: "TEXT"
        description: "Country code of the site"
      - column: "siteregion"
        type: "TEXT"
        description: "Region of the site"
      - column: "therapeuticarea"
        type: "TEXT"
        description: "Therapeutic area of the study"
      - column: "program"
        type: "TEXT"
        description: "Program name"
      - column: "medicalindication"
        type: "TEXT"
        description: "Medical indication for the study"
      - column: "studyphase"
        type: "TEXT"
        description: "Phase of the study"
      - column: "studysponsor"
        type: "TEXT"
        description: "Sponsor of the study"
      - column: "studystatus"
        type: "TEXT"
        description: "Status of the study"
      - column: "studycro"
        type: "TEXT"
        description: "Aggregated string of all distinct CRO names"
      - column: "siteinvestigatorname"
        type: "TEXT"
        description: "Name of the site investigator"
      - column: "sitecraname"
        type: "TEXT"
        description: "Name of the site CRA"
      - column: "arm"
        type: "TEXT"
        description: "Treatment arm. Defaults to Not Available if NULL"
      - column: "brthdtc"
        type: "DATE"
        description: "Subject birth date"
      - column: "age"
        type: "NUMERIC"
        description: "Subject age"
      - column: "sex"
        type: "TEXT"
        description: "Subject sex"
      - column: "race"
        type: "TEXT"
        description: "Subject race"
      - column: "ethnicity"
        type: "TEXT"
        description: "Subject ethnicity"
      - column: "aedy"
        type: "INTEGER"
        description: "Number of days from subject_start_date to AE start date"
      - column: "aeenddy"
        type: "INTEGER"
        description: "Number of days from subject_start_date to AE end date"
      - column: "relative_aedy"
        type: "INTEGER"
        description: "Number of days from demographics date to AE start date"
      - column: "category"
        type: "TEXT"
        description: "Categorizes AE: Serious & Related, Not-Serious & Related, Serious & Unrelated, Not-Serious & Unrelated, or Data Unavailable"
      - column: "ctcae_grade"
        type: "TEXT"
        description: "CTCAE grade. Populated by PLO Post Processing"
      - column: "bucket"
        type: "INTEGER"
        description: "30-day bucket assignment based on aedy"
      - column: "join_helper"
        type: "TEXT"
        description: "Concatenated string: studyid~sitecountry~siteid"
      - column: "objectuniquekey"
        type: "TEXT"
        description: "Unique key for the AE record"
      - column: "comprehend_update_time"
        type: "TIMESTAMP"
        description: "Timestamp when the report was generated"

  # ==========================================================================
  # RPT_LAB_INFORMATION
  # ==========================================================================
  - table: "RPT_LAB_INFORMATION"
    description: "Comprehensive view of laboratory information. Enriches raw lab data with study, subject, and visit details, and calculates key metrics like baseline deviation and abnormal flags."
    columns:
      - column: "comprehendid"
        type: "TEXT"
        description: "Unique identifier for the combined data"
      - column: "studyid"
        type: "TEXT"
        description: "Unique identifier for the study"
      - column: "sitecountrycode"
        type: "TEXT"
        description: "Country code of the study site"
      - column: "studyname"
        type: "TEXT"
        description: "Name of the study"
      - column: "sitename"
        type: "TEXT"
        description: "Name of the study site"
      - column: "siteregion"
        type: "TEXT"
        description: "Region where the study site is located"
      - column: "sitecountry"
        type: "TEXT"
        description: "Country of the study site"
      - column: "siteid"
        type: "TEXT"
        description: "Unique identifier for the study site"
      - column: "usubjid"
        type: "TEXT"
        description: "Unique subject identifier within a study"
      - column: "visit"
        type: "TEXT"
        description: "Name or identifier of the visit"
      - column: "visitdy"
        type: "INTEGER"
        description: "Study day of the visit"
      - column: "isbaselinevisit"
        type: "BOOLEAN"
        description: "Flag indicating if the visit is a baseline visit"
      - column: "svstdtc"
        type: "TIMESTAMP"
        description: "Start date and time of the scheduled visit"
      - column: "visitnum"
        type: "NUMERIC"
        description: "Visit number (from SV or TV if SV is null)"
      - column: "arm"
        type: "TEXT"
        description: "Treatment arm assigned to the subject"
      - column: "lbdtc"
        type: "TIMESTAMP"
        description: "Collection date and time of the lab specimen"
      - column: "lbtm"
        type: "TIME"
        description: "Collection time of the lab specimen"
      - column: "lbdy"
        type: "INTEGER"
        description: "Study day of the lab measurement"
      - column: "lbseq"
        type: "INTEGER"
        description: "Sequence number for the lab record"
      - column: "lbtest"
        type: "TEXT"
        description: "Full name of the lab test"
      - column: "lbtestcd"
        type: "TEXT"
        description: "Coded name of the lab test"
      - column: "lbcat"
        type: "TEXT"
        description: "Category of the lab test"
      - column: "lbscat"
        type: "TEXT"
        description: "Subcategory of the lab test"
      - column: "lbspec"
        type: "TEXT"
        description: "Specimen type for the lab test"
      - column: "lbmethod"
        type: "TEXT"
        description: "Method used for the lab test"
      - column: "lborres"
        type: "TEXT"
        description: "Original result of the lab test"
      - column: "lbstat"
        type: "TEXT"
        description: "Status of the lab result"
      - column: "lbreasnd"
        type: "TEXT"
        description: "Reason for a lab test not being performed"
      - column: "lbstnrlo"
        type: "NUMERIC"
        description: "Lower limit of the standard normal range"
      - column: "lbstnrhi"
        type: "NUMERIC"
        description: "Upper limit of the standard normal range"
      - column: "lborresu"
        type: "TEXT"
        description: "Original unit of the lab result"
      - column: "lbstresn"
        type: "NUMERIC"
        description: "Standardized numeric result of the lab test"
      - column: "lbstresu"
        type: "TEXT"
        description: "Standardized unit of the lab result"
      - column: "lbblfl"
        type: "TEXT"
        description: "Baseline flag for the lab result"
      - column: "lbnrind"
        type: "TEXT"
        description: "Normal range indicator"
      - column: "lbornrhi"
        type: "NUMERIC"
        description: "Original upper limit of the normal range"
      - column: "lbornrlo"
        type: "NUMERIC"
        description: "Original lower limit of the normal range"
      - column: "lbstresc"
        type: "TEXT"
        description: "Standardized character result"
      - column: "lbenint"
        type: "TEXT"
        description: "Enrichment interval"
      - column: "lbevlint"
        type: "TEXT"
        description: "Evaluation interval"
      - column: "lblat"
        type: "TEXT"
        description: "Location of the anatomical origin of the specimen"
      - column: "lblloq"
        type: "NUMERIC"
        description: "Lower limit of quantification"
      - column: "lbloc"
        type: "TEXT"
        description: "Location of the lab test"
      - column: "lbpos"
        type: "TEXT"
        description: "Position of the lab test"
      - column: "lbstint"
        type: "TEXT"
        description: "Standardized interval"
      - column: "lbuloq"
        type: "NUMERIC"
        description: "Upper limit of quantification"
      - column: "lbclsig"
        type: "TEXT"
        description: "Clinical significance"
      - column: "isvisible"
        type: "BOOLEAN"
        description: "Flag indicating if the lab data is visible"
      - column: "lab_days"
        type: "INTEGER"
        description: "Calculated days from subject_start_date to lbdtc if lbdy is NULL"
      - column: "issubjabnormal"
        type: "BOOLEAN"
        description: "TRUE if subject had an abnormal lab result for a given test"
      - column: "baseline_deviation"
        type: "NUMERIC"
        description: "Percentage deviation from baseline"
      - column: "labdays_time"
        type: "TEXT"
        description: "Concatenation of time and lab_days"
      - column: "abnormal_lab_results_count_per_lbtest"
        type: "INTEGER"
        description: "Count of abnormal lab results for each lbtest within each studyid"
      - column: "max_abnormal_by_value_per_lbtest"
        type: "NUMERIC"
        description: "Maximum abnormal by value for each lbtest within each studyid"
      - column: "lb_uniquekey"
        type: "TEXT"
        description: "Unique key: studyid~siteid~usubjid~lbseq"
      - column: "therapeuticarea"
        type: "TEXT"
        description: "Therapeutic area of the study"
      - column: "program"
        type: "TEXT"
        description: "Program associated with the study"
      - column: "medicalindication"
        type: "TEXT"
        description: "Medical indication for the study"
      - column: "studycro"
        type: "TEXT"
        description: "Aggregated CRO names for the study"
      - column: "objectuniquekey"
        type: "TEXT"
        description: "Unique key: lb.objectuniquekey~LABS"
      - column: "comprehend_update_time"
        type: "TIMESTAMP"
        description: "Timestamp when the data was generated"

  # ==========================================================================
  # RPT_EG - Electrocardiogram Data
  # ==========================================================================
  - table: "RPT_EG"
    description: "Comprehensive view of ECG data. Enriches raw ECG measurements with subject demographics, visit details, and calculated metrics such as baseline deviation and abnormality flags."
    columns:
      - column: "comprehendid"
        type: "TEXT"
        description: "Concatenation of studyid~siteid~usubjid"
      - column: "studyid"
        type: "TEXT"
        description: "Unique identifier for the clinical study"
      - column: "siteid"
        type: "TEXT"
        description: "Unique identifier for the study site"
      - column: "usubjid"
        type: "TEXT"
        description: "Unique subject identifier within a specific study"
      - column: "egseq"
        type: "INTEGER"
        description: "Sequence number for the ECG record"
      - column: "egtestcd"
        type: "TEXT"
        description: "Coded name of the ECG test (e.g., HR for Heart Rate)"
      - column: "egtest"
        type: "TEXT"
        description: "Full name of the ECG test"
      - column: "egcat"
        type: "TEXT"
        description: "Category of the ECG test"
      - column: "egscat"
        type: "TEXT"
        description: "Subcategory of the ECG test"
      - column: "egpos"
        type: "TEXT"
        description: "Position of the subject during the ECG recording"
      - column: "egorres"
        type: "TEXT"
        description: "Original result of the ECG test as reported"
      - column: "egorresu"
        type: "TEXT"
        description: "Original unit of the ECG result"
      - column: "egstresn"
        type: "NUMERIC"
        description: "Standardized numeric result of the ECG test"
      - column: "egstresu"
        type: "TEXT"
        description: "Standardized unit of the ECG result"
      - column: "egstat"
        type: "TEXT"
        description: "Status of the ECG result"
      - column: "egloc"
        type: "TEXT"
        description: "Location where the ECG was performed"
      - column: "egblfl"
        type: "TEXT"
        description: "Baseline flag"
      - column: "visit"
        type: "TEXT"
        description: "Name or identifier of the visit"
      - column: "visitdate"
        type: "TIMESTAMP"
        description: "Start date and time of the scheduled visit"
      - column: "isvisible"
        type: "BOOLEAN"
        description: "Flag indicating if the ECG data should be visible"
      - column: "egdtc"
        type: "TIMESTAMP"
        description: "Date and time the ECG was performed"
      - column: "egtm"
        type: "TIME"
        description: "Time the ECG was performed"
      - column: "egtimpnt"
        type: "TEXT"
        description: "Planned time point of the ECG measurement"
      - column: "egstnrlo"
        type: "NUMERIC"
        description: "Lower limit of the standard normal range"
      - column: "egstnrhi"
        type: "NUMERIC"
        description: "Upper limit of the standard normal range"
      - column: "isabnormal"
        type: "BOOLEAN"
        description: "Flag indicating whether ECG result is abnormal"
      - column: "egornrhi"
        type: "NUMERIC"
        description: "Original upper limit of the normal range"
      - column: "egornrlo"
        type: "NUMERIC"
        description: "Original lower limit of the normal range"
      - column: "egclsig"
        type: "TEXT"
        description: "Clinical significance of the ECG result"
      - column: "egdy"
        type: "INTEGER"
        description: "Calculated study day for the ECG measurement"
      - column: "eg_uniquekey"
        type: "TEXT"
        description: "Unique key: studyid~siteid~usubjid~egseq"
      - column: "objectuniquekey"
        type: "TEXT"
        description: "Unique key: studyid~siteid~usubjid~egseq~ECG"
      - column: "comprehend_update_time"
        type: "TIMESTAMP"
        description: "Timestamp when the table is populated"
      - column: "baseline_deviation"
        type: "NUMERIC"
        description: "Percentage deviation from baseline ECG result"
      - column: "egdy_time"
        type: "TEXT"
        description: "Combined string: ECG time and study day"

  # ==========================================================================
  # RPT_VS - Vital Signs
  # ==========================================================================
  - table: "RPT_VS"
    description: "Consolidates and analyzes Vital Signs data. Enriches raw vital signs measurements with subject demographic information, visit details, and calculated metrics."
    columns:
      - column: "comprehendid"
        type: "TEXT"
        description: "Concatenation of studyid~siteid~usubjid"
      - column: "studyid"
        type: "TEXT"
        description: "Unique identifier for the clinical study"
      - column: "siteid"
        type: "TEXT"
        description: "Unique identifier for the study site"
      - column: "usubjid"
        type: "TEXT"
        description: "Unique subject identifier"
      - column: "vsseq"
        type: "INTEGER"
        description: "Sequence number for the vital sign record"
      - column: "vstestcd"
        type: "TEXT"
        description: "Coded name of the vital sign test (e.g., TEMP, PULSE)"
      - column: "vstest"
        type: "TEXT"
        description: "Full name of the vital sign test"
      - column: "vscat"
        type: "TEXT"
        description: "Category of the vital sign test"
      - column: "vsscat"
        type: "TEXT"
        description: "Subcategory of the vital sign test"
      - column: "vspos"
        type: "TEXT"
        description: "Position of the subject during measurement"
      - column: "vsorres"
        type: "TEXT"
        description: "Original result of the vital sign measurement"
      - column: "vsorresu"
        type: "TEXT"
        description: "Original unit of the vital sign result"
      - column: "vsstresn"
        type: "NUMERIC"
        description: "Standardized numeric result"
      - column: "vsstresu"
        type: "TEXT"
        description: "Standardized unit of the vital sign result"
      - column: "vsstat"
        type: "TEXT"
        description: "Status of the vital sign result"
      - column: "vsloc"
        type: "TEXT"
        description: "Location where the vital sign was taken"
      - column: "vsblfl"
        type: "TEXT"
        description: "Baseline flag"
      - column: "visit"
        type: "TEXT"
        description: "Name or identifier of the visit"
      - column: "visitdate"
